name: Bug report
description: Report something that is broken in Tapbar
title: "[BUG] "
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Please write in English. If needed, use a translator.** Issues in other languages may be closed.
        >
        > **Follow-up questions must be answered within 24 hours or the issue will be closed.**
        >
        > Check the [latest release changelog](https://github.com/Earendel-lab/Tapbar/releases/latest) to see if the bug is already fixed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and this is not a duplicate
          required: true
        - label: I am using the latest Tapbar version and checked the latest release changelog to see if this is already fixed
          required: true

  - type: textarea
    id: bug
    attributes:
      label: Describe the bug
      description: What went wrong? Be specific.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tapbar
        2. Go to ...
        3. Perform ...
        4. See the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Nothing Phone 1
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: e.g. Android 17
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: OS / ROM
      placeholder: e.g. Nothing OS 4.0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tapbar version
      placeholder: e.g. v1.6
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots / screen recording / logs
      description: Drag and drop files here. Strongly recommended.

  - type: textarea
    id: context
    attributes:
      label: Additional context
